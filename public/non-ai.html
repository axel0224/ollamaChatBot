<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>non-ai</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/145b19ae93.js" crossorigin="anonymous"></script>
    <style>
        body {
            background-color: #728C69;
            color: #ffffff;
        }

        .journal-card {
            border-radius: 30px;
            padding: 2rem;
            max-width: 500px;
            margin: 2rem auto;
            color: #ffffff;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        textarea {
            resize: none;
            border-radius: 20px;
            border: none;
            padding: 1rem;
            min-height: 200px;
            width: 100%;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background-color: #523083;
            border-color: #523083;
        }
        .btn-primary:hover {
            background-color: #6d3da5;
            border-color: #6d3da5;
        }
        .logo{
            width: 60px;
        }

        #chatBox {
            background-color: #fff;
            height: 400px;
            overflow-y: auto;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
    <h1>Non-AI journal page</h1>
    <div class="journal-card">
        <!-- Header -->
        <div class="header-bar mb-4">
            <a href="option.html" class="btn btn-link p-0 me-2 text-decoration-none">
                <i class="fa-solid fa-arrow-left" style="color: #523083"></i>
            </a>

            <a href="#" class="btn btn-link p-0 text-decoration-none">
                <i class="fa-solid fa-book" style="color: #523083"></i>
            </a>

            <img src="./images/eagle.svg" alt="Responder health logo" class="logo" />
        </div>
    </div>

    <!-- Title and Date -->
    <h2 class="fw-bold">My Journal</h2>
    <h5 id="current-date" class="text-light"></h5>

    <!-- Prompt Bubble -->
    <div class="prompt-bubble">
        Tell me how you are doing today.
    </div>

    <!-- Chat Box and Input -->
    <div id="chatBox" class="chat-box mb-3 p-3"></div>

    <!-- message input -->
    <div class="input-group">
        <textarea id="userInput" class="form-control" placeholder="Type your message here..." rows="1" aria-label="User Input"></textarea>
        <button id="sendButton" class="btn btn-primary" type="button">Save entry</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {


            // Set the current date in the header
            document.getElementById('current-date').textContent = new Date().toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            })
            
        })
    </script>
</body>
</html>
