<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/145b19ae93.js" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #728C69;
            color: #ffffff;
        }
        .journal-card {
            border-radius: 30px;
            padding: 2rem;
            max-width: 500px;
            margin: 2rem auto;
            color: #ffffff;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .prompt-bubble {
            background-color: #523083;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            display: inline-block;
            font-weight:500;
            margin: 1rem 0;
        }

        textarea {
            resize: none;
            border-radius: 20px;
            border: none;
            padding: 1rem;
            min-height: 200px;
            width: 100%;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background-color: #523083;
            border-color: #523083;
        }
        .btn-primary:hover {
            background-color: #6d3da5;
            border-color: #6d3da5;
        }
        .logo{
            width: 60px;
        }

        #chatBox {
            background-color: #fff;
            height: 400px;
            overflow-y: auto;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: inline-block;
            min-width: 60px;                  
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 15px;
            word-break: break-word;
            white-space: normal;
            overflow-wrap: break-word;
            line-height: 1.4;
            word-spacing: 1px;                 
            background-color: #D1C4E9;
        }
        .user-message {
            align-self: flex-end;
            background-color: #D1C4E9;
            color: #333;
            border-bottom-right-radius: 0;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #E8F5E9;
            color: #333;
            border-bottom-left-radius: 0;
        }
        .input-group {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 30px; 
            overflow: hidden;
        }
        .loading-bubble {
            font-style: italic;
            font-family: monospace;   
            opacity: 0.6;
            animation: blink 1.2s infinite ease-in-out;
            white-space: nowrap;    
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
            .message-wrapper.right {
            align-self: flex-end;
            align-items: flex-end;
            width: 100%;
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .message-wrapper.left {
            align-self: flex-start;
        }

        .timestamp {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            text-align: right;
            padding: 0 10px;
        }
    </style>
</head>
<body>
    <div class="journal-card">
        <!-- Header -->
        <div class="header-bar mb-4">
            <!-- button that goes back to the option page -->
            <a href="option.html" class="btn btn-link p-0 me-2 text-decoration-none">
                <i class="fa-solid fa-arrow-left" style="color: #523083"></i>
            </a>


            <i class="fa-solid fa-book" style="color: #523083"></i>


            <img src="./images/eagle.svg" alt="Responder health logo" class="logo" />
        </div>


        <!-- Title and Date -->
        <h2 class="fw-bold">My Journal</h2>
        <h5 id="current-date" class="text-light"></h5>

        <!-- Prompt Bubble -->
        <div class="prompt-bubble" id="promptText">
            Tell me how you are doing today.
        </div>

        <!-- Prompt Generator -->
        <div class="d-flex justify-content-between mt-2">
            <button id="dailyPromptBtn" class="btn btn-sm btn-light">Daily Prompt</button>
            <button id="rollPromptBtn" class="btn btn-sm btn-light">New Prompt</button>
        </div>


        <!-- Chat Box and Input -->
        <div id="chatBox" class="chat-box mb-3 p-3"></div>

        <!-- message input -->
        <div class="input-group">
            <textarea id="userInput" class="form-control" placeholder="Type your message here..." rows="1" aria-label="User Input"></textarea>
            <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get references to DOM elements
            const chatBox = document.getElementById('chatBox');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const messages = []; // Array to store chat messages


            // Function to handle sending a message
            const sendMessage = async () => {
                const text = userInput.value.trim(); // Get and trim user input
                if (!text) return; // Do nothing if input is empty

                appendMessage(text, 'user'); // Add user's message to the chat box
                //messages.push({ role: 'user', content: text }); // Save user's message
                userInput.value = ''; // Clear the input field

                // Add a loading bubble to indicate AI is responding
                const loadingBubble = appendMessage('...', 'ai', true);               

                try {
                    // Send the user's message to the backend
                    const res = await fetch('http://localhost:3000/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            model: 'journal-coach',
                            messages: [{ role: 'user', content: text}]
                        })
                    });

                    const data = await res.json(); // Parse the response
                    const aiReply = data.message?.content || 'Sorry, no response.'; // Get AI's reply

                    loadingBubble.remove(); // Remove the loading bubble
                    appendMessage(aiReply, 'ai'); // Add AI's reply to the chat box
                    //messages.push({ role: 'assistant', content: aiReply }); // Save AI's reply

                    // save conversation history to database
                    await fetch('http://localhost:3000/conversation', {
                        method: 'POST',
                        headers: { 'Content-Type' : 'application/json' },
                        body: JSON.stringify({
                            UserEntry: text,
                            AIResponse: aiReply 
                        })
                    })
                } catch (err) {
                    console.error('Error communicating with backend:', err); // Log any errors
                    loadingBubble.remove(); // Remove the loading bubble
                    appendMessage('Error talking to journal coach.', 'ai'); // Show error message
                }
            };

            // Add click event listener to the send button
            sendBtn.addEventListener('click', sendMessage);

            // Add keydown event listener to the input field for the Enter key
            userInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Prevent default form submission behavior
                    sendMessage(); // Trigger the sendMessage function
                }
            });

            // Adjust the height of the input field dynamically as the user types
            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto'; // Reset height
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px'; // Adjust height
            });

            // Function to append a message to the chat box
            function appendMessage(text, sender, isLoading = false) {
                const messageWrapper = document.createElement('div'); // Create a wrapper for the message
                messageWrapper.classList.add('message-wrapper', sender === 'user' ? 'right' : 'left');

                const messageDiv = document.createElement('div'); // Create the message bubble
                messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
                messageDiv.textContent = text; // Set the message text

                const timestamp = document.createElement('div'); // Create a timestamp element
                timestamp.classList.add('timestamp');

                if (!isLoading) {
                    const now = new Date(); // Get the current time
                    timestamp.textContent = now.toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } else {
                    timestamp.textContent = ''; // No timestamp for loading bubbles
                }

                // Append the message and timestamp to the wrapper
                messageWrapper.appendChild(messageDiv);
                messageWrapper.appendChild(timestamp);

                // Add the wrapper to the chat box
                chatBox.appendChild(messageWrapper);
                chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the bottom of the chat box

                return messageWrapper; // Return the wrapper (useful for loading bubbles)
            }

            // Set the current date in the header
            document.getElementById('current-date').textContent = new Date().toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // ---- Prompt Generator ----

            // Prompts 
            const PROMPTS = [
            { id: 1, text: "What’s one moment today you felt proud of?" },
            { id: 2, text: "Describe a call or event that stuck with you today." },
            { id: 3, text: "What helped you keep going at a hard moment?" },
            { id: 4, text: "Write about something outside of work that gave you energy." },
            { id: 5, text: "If today had a headline, what would it be?" },
            { id: 6, text: "What’s one small act of kindness you noticed or gave?" },
            { id: 7, text: "Name one strength you used today and how it showed up." },
            { id: 8, text: "What’s a thought or feeling you’d like to leave here tonight?" },
            { id: 9, text: "What are you grateful for today, no matter how big or small?"},
            { id: 10, text: "What are your top priorities for the day?"},
            { id: 11, text: "What are you working towards, and what steps can you take today? "},
            { id: 12, text: "What surprised you today?" },
            { id: 13, text: "Write about a moment you felt connected to someone." },
            { id: 14, text: "What was the most challenging part of your day, and how did you handle it?" },
            { id: 15, text: "What gave you a sense of calm or peace today?" },
            { id: 16, text: "If you could capture one image from today, what would it be?" },
            { id: 17, text: "What’s something you learned about yourself recently?" },
            { id: 18, text: "Who supported you today, directly or indirectly?" },
            { id: 19, text: "Describe a time you laughed or smiled today." },
            { id: 20, text: "What’s one thing you wish had gone differently, and why?" },
            { id: 21, text: "What intention do you want to carry into tomorrow?" },
            { id: 22, text: "What’s one thing you’d like to let go of before the day ends?" },
            { id: 23, text: "What energized you more than you expected?" },
            { id: 24, text: "If you could write a message to your future self about today, what would it say?" },
            { id: 25, text: "What was the simplest joy you experienced today?" },
            { id: 26, text: "How did you take care of yourself today?" },
            { id: 27, text: "What’s one skill or strength you’d like to grow tomorrow?" },
            { id: 28, text: "What part of today are you most likely to remember a year from now?" },
            { id: 29, text: "What emotions showed up for you today, and how did you respond?" },
            { id: 30, text: "What’s one thing you’re carrying forward from today into the rest of the week?" }
            ];

            // Deterministic daily pick (stable per day)
            function getDailyPromptObj() {
                const today = new Date().toDateString();
                let hash = 0;
                for (let i = 0; i < today.length; i++) {
                    hash = today.charCodeAt(i) + ((hash << 5) - hash);
                }
                return PROMPTS[Math.abs(hash) % PROMPTS.length];
            }

            // Random roll
            function getRandomPromptObj() {
                return PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
            }

            // Cache DOM
            const promptTextEl = document.getElementById('promptText');
            const dailyBtn = document.getElementById('dailyPromptBtn');
            const rollBtn = document.getElementById('rollPromptBtn');

            // Track current prompt 
            window.__currentPromptId = null;
            window.__currentPromptSource = 'daily';

            function setCurrentPrompt(p, source) {
                promptTextEl.textContent = p.text;
                window.__currentPromptId = p.id;
                window.__currentPromptSource = source; // 'daily' or 'rolled'
            }

            // Wire buttons
            dailyBtn.addEventListener('click', () => setCurrentPrompt(getDailyPromptObj(), 'daily'));
            rollBtn.addEventListener('click',  () => setCurrentPrompt(getRandomPromptObj(), 'rolled'));

            // Initialize with today's prompt
            setCurrentPrompt(getDailyPromptObj(), 'daily');
            
        });
    </script>
</body>
</html>
