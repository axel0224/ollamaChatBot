<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ollama Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/145b19ae93.js" crossorigin="anonymous"></script>

    <style>
        body {
            background-color: #728C69;
            color: #ffffff;
        }
        .journal-card {
            border-radius: 30px;
            padding: 2rem;
            max-width: 500px;
            margin: 2rem auto;
            color: #ffffff;
        }
        .header-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .prompt-bubble {
            background-color: #523083;
            color: #ffffff;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            display: inline-block;
            font-weight:500;
            margin: 1rem 0;
        }

        textarea {
            resize: none;
            border-radius: 20px;
            border: none;
            padding: 1rem;
            min-height: 200px;
            width: 100%;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background-color: #523083;
            border-color: #523083;
        }
        .btn-primary:hover {
            background-color: #6d3da5;
            border-color: #6d3da5;
        }
        .logo{
            width: 60px;
        }

        #chatBox {
            background-color: #fff;
            height: 400px;
            overflow-y: auto;
            border-radius: 50px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: inline-block;
            min-width: 60px;                   /* ✅ Add this to prevent vertical stacking */
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 15px;
            word-break: break-word;
            white-space: normal;
            overflow-wrap: break-word;
            line-height: 1.4;
            word-spacing: 1px;                 
            background-color: #D1C4E9;
        }
        .user-message {
            align-self: flex-end;
            background-color: #D1C4E9;
            color: #333;
            border-bottom-right-radius: 0;
        }
        .ai-message {
            align-self: flex-start;
            background-color: #E8F5E9;
            color: #333;
            border-bottom-left-radius: 0;
        }
        .input-group {
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 30px; 
            overflow: hidden;
        }
        .loading-bubble {
            font-style: italic;
            font-family: monospace;   
            opacity: 0.6;
            animation: blink 1.2s infinite ease-in-out;
            white-space: nowrap;    
        }

        @keyframes blink {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        .message-wrapper {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.message-wrapper.right {
  align-self: flex-end;
  align-items: flex-end;
  width: 100%;
  display: flex;
  flex-direction: column;
  max-width: 100%;
}

        .message-wrapper.left {
            align-self: flex-start;
            }

        .timestamp {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            text-align: right;
            padding: 0 10px;
            }
    </style>
</head>
<body>
    <div class="journal-card">
        <!-- Header -->
        <div class="header-bar mb-4">
            <a href="#" class="btn btn-link p-0 me-2 text-decoration-none">
                <i class="fa-solid fa-arrow-left" style="color: #523083"></i>
            </a>

            <a href="#" class="btn btn-link p-0 text-decoration-none">
                <i class="fa-solid fa-book" style="color: #523083"></i>
            </a>

            <img src="/images/eagle.svg" alt="Responder health logo" class="logo" />
        </div>


        <!-- Title and Date -->
        <h2 class="fw-bold">My Journal</h2>
        <h5 id="current-date" class="text-light"></h5>

        <!-- Prompt Bubble -->
        <div class="prompt-bubble">
            Tell me how you are doing today.
        </div>

        <!-- Chat Box and Input -->
        <div id="chatBox" class="chat-box mb-3 p-3"></div>

        <!-- message input -->
         <div class="input-group">
            <textarea id="userInput" class="form-control" placeholder="Type your message here..." rows="1" aria-label="User Input"></textarea>
            <button class="btn btn-primary" id="sendBtn">Send</button>
         </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatBox = document.getElementById('chatBox');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const messages = [];

            // Function to handle sending a message
            const sendMessage = async () => {
                const text = userInput.value.trim();
                if (!text) return;

                appendMessage(text, 'user');
                messages.push({ role: 'user', content: text });
                userInput.value = '';

                // Add loading bubble before fetching AI response
                const loadingBubble = appendMessage('...', 'ai', true); // true = isLoading

                try {
                    const res = await fetch('http://localhost:3000/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ messages, model: 'journal-coach' })
                    });

                    const data = await res.json();
                    const aiReply = data.message?.content || 'Sorry, no response.';

                    // Remove loading bubble
                    loadingBubble.remove();

                    // Add actual AI message
                    appendMessage(aiReply, 'ai');
                    messages.push({ role: 'assistant', content: aiReply });

                } catch (err) {
                    console.error('Error communicating with backend:', err);
                    loadingBubble.remove();
                    appendMessage('Error talking to journal coach.', 'ai');
                }
            };

            // Add click event listener to the send button
            sendBtn.addEventListener('click', sendMessage);

            // Add keydown event listener to the input field for the Enter key
            userInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Prevent default form submission behavior
                    sendMessage();
                }
            });

            userInput.addEventListener('input', () => {
                userInput.style.height = 'auto';
                userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
            })

            function appendMessage(text, sender, isLoading = false) {
                const messageWrapper = document.createElement('div');
                messageWrapper.classList.add('message-wrapper', sender === 'user' ? 'right' : 'left');

                const messageDiv = document.createElement('div');
                messageDiv.classList.add('message', sender === 'user' ? 'user-message' : 'ai-message');
                messageDiv.textContent = text;

                const timestamp = document.createElement('div');
                timestamp.classList.add('timestamp');

                if (!isLoading) {
                    const now = new Date();
                    timestamp.textContent = now.toLocaleTimeString([], {
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                } else {
                    timestamp.textContent = ''; // Don't show time for loading
                }

                messageWrapper.appendChild(messageDiv);
                messageWrapper.appendChild(timestamp);

                chatBox.appendChild(messageWrapper);
                chatBox.scrollTop = chatBox.scrollHeight;

                return messageWrapper;
            }

            // Set date
            document.getElementById('current-date').textContent = new Date().toLocaleDateString(undefined, {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        });
    </script>
</body>
</html>
